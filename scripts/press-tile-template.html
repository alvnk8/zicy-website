<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .tile {
    width: 800px;
    height: 600px;
    background: __FIELD_COLOR__;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    /* Same font stack as --fd in src/styles/theme.css. Fraunces isn't bundled into this
       standalone script, so it renders via the Georgia fallback already built into that stack
       — not a new font, just the same stack's fallback tier. */
    font-family: 'Fraunces Variable', 'Fraunces', Georgia, serif;
  }
  .tile img.logo {
    max-width: 520px;
    max-height: 280px;
    object-fit: contain;
  }
  .tile .wordmark {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: __TEXT_COLOR__;
    text-align: center;
    padding: 0 60px;
  }
  .glyph {
    position: absolute;
    bottom: 32px;
    right: 32px;
    width: 56px;
    height: 56px;
  }
</style>
</head>
<body>
  <div class="tile">
    __CONTENT__
    <div class="glyph">__GLYPH__</div>
  </div>
</body>
</html>
